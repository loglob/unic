name: Create release on tag and attach source package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare source package
        run: ./source-package.sh ${{ github.ref_name }}

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            unic-*.tar.gz \
            --title "Release ${GITHUB_REF_NAME}" \
            --draft \
            --notes "Automated release for ${GITHUB_REF_NAME}"
