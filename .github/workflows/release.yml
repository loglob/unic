name: Create release on tag and attach source package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Prepare source package
        run: ./source-package.sh "${{ github.ref_name }}"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]
          then
            prerelease="--prerelease"
          fi
          
          gh release create "${GITHUB_REF_NAME}" \
            unic-*.tar.gz \
            --title "${GITHUB_REF_NAME}" \
            --draft $prerelease \
            --notes "Automated release for ${GITHUB_REF_NAME}"
